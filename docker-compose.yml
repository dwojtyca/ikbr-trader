x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile
  image: ikbr-trader-app:local

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ikbr_trader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./infra/sql:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ikbr_trader"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  ingestion:
    <<: *app-image
    command: pnpm --filter @ikbr/ingestion start
    env_file:
      - .env
    environment:
      INGESTION_PORT: 3101
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/ikbr_trader
      REDIS_URL: redis://redis:6379
      IB_SOCKET_HOST: host.docker.internal
      INGESTION_SIGNAL_ENGINE_BASE_URL: http://signal-engine:3102
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3101:3101"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  signal-engine:
    <<: *app-image
    command: pnpm --filter @ikbr/signal-engine start
    env_file:
      - .env
    environment:
      SIGNAL_PORT: 3102
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/ikbr_trader
      REDIS_URL: redis://redis:6379
      SIGNAL_EXECUTION_BASE_URL: http://execution-engine:3103
      # Phase 1 / PR1 (schema-only). Runtime attach in PR2.
      EXECUTION_API_TOKEN: ${EXECUTION_API_TOKEN:-}
      # Phase 2 / PR13 — Execution Runtime (paper-only write endpoint).
      # OFF by default. Setting to "true" only enables paper submission;
      # live is impossible via env (see execution-runtime/config.ts).
      EXECUTION_RUNTIME_ENABLED: ${EXECUTION_RUNTIME_ENABLED:-false}
      # Phase 2 / PR14 — Trading Loop scheduler (paper-only).
      # OFF by default. Also requires EXECUTION_RUNTIME_ENABLED=true —
      # the loop is wired only inside that branch.
      TRADING_LOOP_ENABLED: ${TRADING_LOOP_ENABLED:-false}
      TRADING_LOOP_INTERVAL_MS: ${TRADING_LOOP_INTERVAL_MS:-30000}
      TRADING_LOOP_STARTUP_DELAY_MS: ${TRADING_LOOP_STARTUP_DELAY_MS:-1000}
      TRADING_LOOP_MAX_CONCURRENT_INSTRUMENTS: ${TRADING_LOOP_MAX_CONCURRENT_INSTRUMENTS:-2}
      TRADING_LOOP_INSTRUMENT_IDS: ${TRADING_LOOP_INSTRUMENT_IDS:-}
      TRADING_LOOP_SHUTDOWN_TIMEOUT_MS: ${TRADING_LOOP_SHUTDOWN_TIMEOUT_MS:-10000}
      TRADING_LOOP_EXPOSURE_TIMEOUT_MS: ${TRADING_LOOP_EXPOSURE_TIMEOUT_MS:-3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3102:3102"
    restart: unless-stopped

  execution-engine:
    <<: *app-image
    command: pnpm --filter @ikbr/execution-engine start
    env_file:
      - .env
    environment:
      EXECUTION_PORT: 3103
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/ikbr_trader
      IB_SOCKET_HOST: host.docker.internal
      # Phase 1 / PR1 (schema-only). Runtime bind change lands in PR2.
      # Docker containers can only reach a sibling service on 0.0.0.0;
      # the auth middleware in PR2 is the actual security boundary here.
      EXECUTION_BIND_HOST: 0.0.0.0
      IBKR_ENVIRONMENT: ${IBKR_ENVIRONMENT:-paper}
      TRADING_ENABLED: ${TRADING_ENABLED:-false}
      ALLOWED_PAPER_ACCOUNTS: ${ALLOWED_PAPER_ACCOUNTS:-}
      ALLOWED_LIVE_ACCOUNTS: ${ALLOWED_LIVE_ACCOUNTS:-}
      EXECUTION_API_TOKEN: ${EXECUTION_API_TOKEN:-}
      EXECUTION_ALLOW_MKT: ${EXECUTION_ALLOW_MKT:-false}
      EXECUTION_ALLOW_DIRECT_TICKET: ${EXECUTION_ALLOW_DIRECT_TICKET:-false}
      EXECUTION_READY_RECONCILIATION_MAX_AGE_S: ${EXECUTION_READY_RECONCILIATION_MAX_AGE_S:-900}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3103:3103"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  llm-agent:
    <<: *app-image
    command: pnpm --filter @ikbr/llm-agent start
    env_file:
      - .env
    environment:
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/ikbr_trader
      LLM_AGENT_EXECUTION_BASE_URL: http://execution-engine:3103
      # Phase 1 / PR1 (schema-only). Runtime attach in PR2.
      EXECUTION_API_TOKEN: ${EXECUTION_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      execution-engine:
        condition: service_started
    restart: unless-stopped

  backtest-engine:
    <<: *app-image
    command: pnpm --filter @ikbr/backtest-engine start
    env_file:
      - .env
    environment:
      BACKTEST_PORT: 3104
      BACKTEST_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@postgres:5432/postgres
      BACKTEST_POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/ikbr_trader_backtest
      IB_SOCKET_HOST: host.docker.internal
      # Backtest loads multi-year multi-timeframe candles into memory.
      # 12M+ 1m rows alone need >4GB. Bump Node heap so OOM doesn't kill
      # the run before it starts.
      NODE_OPTIONS: "--max-old-space-size=8192"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3104:3104"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  ui:
    <<: *app-image
    command: pnpm --filter @ikbr/ui dev
    environment:
      UI_HOST: 0.0.0.0
      UI_PORT: 5173
      UI_INGESTION_PROXY_TARGET: http://ingestion:3101
      UI_SIGNAL_PROXY_TARGET: http://signal-engine:3102
      UI_EXECUTION_PROXY_TARGET: http://execution-engine:3103
      UI_BACKTEST_PROXY_TARGET: http://backtest-engine:3104
      # Phase 1 / PR1 (schema-only). Vite proxy attaches this header from PR2.
      EXECUTION_API_TOKEN: ${EXECUTION_API_TOKEN:-}
    depends_on:
      - ingestion
      - signal-engine
      - execution-engine
      - llm-agent
      - backtest-engine
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  pgdata:
